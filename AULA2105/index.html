<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <a href="flexbox.html">Outra</a>
    <h1>Formularios</h1>
    <div class="conteudo-formulario">
        <form>
            <label for="Nome">Nome:</label>
            <input type="text" name="Nome" id="Nome"  size="20" maxlength="20" placeholder="Seu nome">
            <label for="Sobrenome">Sobrenome:</label>
            <input type="text" name="Sobrenome" id="Sobrenome" placeholder="Seu sobrenome">


            <h3>Selecione seu Curso</h3>
            <input type="radio" name="Curso" id="TINF">
            <label for="TINF">Informatica</label>
            <input type="radio" name="Curso" id="TCON">
            <label for="TCON">Contabilidade</label>
            <input type="radio" name="Curso" id="TADM">
            <label for="TADM">Administração</label>
            <input type="radio" name="Curso" id="TELE">
            <label for="TELE">Eletronica</label>

            <h3>Dados</h3>
            <label for="Email">Email:</label>
            <input type="email" id="Email" placeholder="Seu Email" required>
            <label for="Senha">Senha:</label>
            <input type="password" id="Senha" placeholder="Sua senha" required  >
  
            <div>
                <h3>Escolha sua materia favorita</h3>

                <input type="checkbox" id="port"><label for="port">Portugues</label>
                <input type="checkbox" id="prog"><label for="prog">Programação</label>
                <input type="checkbox" id="mat"><label for="mat">Matematica</label>
                <input type="checkbox" id="his"><label for="his">Historia</label>


            </div>
            <div>
                <h3>Escolha o ano cursado</h3>
                <select>
                    <option value="1">1° ano</option>
                    <option value="2">2° ano</option>
                    <option value="3">3° ano</option>

                </select>
            </div>

            <textarea></textarea>
            <br>
            <button>Otro site</button>

        </form>
    </div>
</body>
</html>
